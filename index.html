<!doctype html>
<html lang="no">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f3d63">
<title>Øst – NM Regionlag</title>
<style>
:root {
  --navy:#0f3d63;
  --blue:#1f6fa9;
  --light:#eef5fa;
  --card:#ffffff;
  --text:#14212b;
  --muted:#60707c;
  --border:#d9e4ec;
  --good:#dff2e4;
  --warn:#fff0c9;
  --bad:#f6dddd;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0;
  font-family:system-ui,-apple-system,Segoe UI,Roboto,Arial,sans-serif;
  background:#f5f8fb;
  color:var(--text);
}
.app{max-width:760px;margin:0 auto;min-height:100vh;background:#f5f8fb}
header{
  position:sticky;top:0;z-index:20;
  background:rgba(15,61,99,.97);
  color:white;padding:14px 14px 10px;
  box-shadow:0 2px 12px rgba(0,0,0,.14)
}
.topline{display:flex;justify-content:space-between;align-items:center;gap:12px}
h1{font-size:20px;margin:0;font-weight:800}
.sub{font-size:12px;opacity:.85;margin-top:2px}
.team-tabs{
  display:flex;gap:8px;overflow-x:auto;padding:10px 0 2px;
  scrollbar-width:none
}
.team-tabs::-webkit-scrollbar{display:none}
.team-btn{
  border:0;border-radius:999px;padding:9px 12px;white-space:nowrap;
  background:rgba(255,255,255,.14);color:white;font-weight:700
}
.team-btn.active{background:white;color:var(--navy)}
main{padding:14px}
.section{
  background:var(--card);border:1px solid var(--border);border-radius:18px;
  margin:0 0 14px;padding:14px;box-shadow:0 3px 12px rgba(24,60,84,.06)
}
.section h2{margin:0 0 10px;font-size:17px}
.small{font-size:12px;color:var(--muted)}
.player-list{display:grid;gap:8px}
.player{
  display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;
  border:1px solid var(--border);border-radius:12px;padding:10px 12px;background:#fff
}
.player strong{font-size:15px}
.rank{text-align:right;font-variant-numeric:tabular-nums}
.rank-main{font-size:16px;font-weight:800}
.rank-sub{font-size:11px;color:var(--muted)}
.match-list{display:grid;gap:10px}
.match{
  border:1px solid var(--border);border-left:5px solid var(--blue);
  border-radius:14px;padding:12px;background:#fff
}
.match-top{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}
.match-time{font-weight:800;font-size:18px}
.match-opp{font-size:16px;font-weight:750;margin-top:3px}
.meta{font-size:12px;color:var(--muted);margin-top:7px;display:flex;flex-wrap:wrap;gap:8px}
.combo-wrap{display:grid;gap:8px}
.combo{
  display:grid;grid-template-columns:1fr auto;gap:10px;align-items:center;
  padding:10px 12px;border-radius:12px;border:1px solid var(--border)
}
.combo-score{font-weight:850;font-variant-numeric:tabular-nums}
.combo.good{background:var(--good)}
.combo.mid{background:var(--warn)}
.combo.high{background:var(--bad)}
.program-day{margin-top:12px;font-weight:850;font-size:15px;color:var(--navy)}
.program-row{
  display:grid;grid-template-columns:94px 1fr;gap:10px;
  padding:9px 0;border-bottom:1px solid #edf1f4
}
.program-row:last-child{border-bottom:0}
.program-time{font-weight:750;font-variant-numeric:tabular-nums}
.toolbar{display:flex;gap:8px;margin-bottom:10px}
.toggle{
  border:1px solid var(--border);background:#fff;border-radius:999px;
  padding:7px 10px;font-size:12px;font-weight:700
}
.toggle.active{background:var(--navy);color:#fff;border-color:var(--navy)}
.hidden{display:none!important}
footer{text-align:center;color:var(--muted);font-size:11px;padding:8px 12px 24px}
@media (min-width:640px){
  main{padding:18px}
  .player-list{grid-template-columns:1fr 1fr}
}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="topline">
    <div>
      <h1>Øst – NM Regionlag</h1>
      <div class="sub">Spillere, ranking, kamper og program</div>
    </div>
  </div>
  <div class="team-tabs" id="tabs"></div>
</header>

<main>
  <section class="section">
    <h2>Spillerliste</h2>
    <div class="small">Ranking pr. 18.08.2026</div>
    <div class="player-list" id="players"></div>
  </section>

  <section class="section">
    <h2>Kamper</h2>
    <div class="match-list" id="matches"></div>
  </section>

  <section class="section">
    <h2>Lagkombinasjoner</h2>
    <div class="toolbar">
      <button class="toggle active" id="sortLow">Lavest ranking først</button>
      <button class="toggle" id="sortName">Navn</button>
    </div>
    <div class="small" style="margin-bottom:8px">Alle kombinasjoner med 2 spillere.</div>
    <div class="combo-wrap" id="combos"></div>
  </section>

  <section class="section">
    <h2>Program</h2>
    <div id="program"></div>
  </section>
</main>
<footer>Mobiltilpasset oversikt • Øst regionlag</footer>
</div>

let currentTeam = Object.keys(DATA)[0];
let comboSort = "low";

const tabs = document.getElementById("tabs");
const playersEl = document.getElementById("players");
const matchesEl = document.getElementById("matches");
const combosEl = document.getElementById("combos");
const programEl = document.getElementById("program");

function fmt(n) {
  return new Intl.NumberFormat("nb-NO").format(n);
}

function renderTabs() {
  tabs.innerHTML = "";
  Object.keys(DATA).forEach(name => {
    const b = document.createElement("button");
    b.className = "team-btn" + (name === currentTeam ? " active" : "");
    b.textContent = name.replace("Øst ","");
    b.onclick = () => { currentTeam = name; render(); };
    tabs.appendChild(b);
  });
}

function renderPlayers() {
  playersEl.innerHTML = DATA[currentTeam].players.map(p => `
    <div class="player">
      <strong>${p.name}</strong>
      <div class="rank">
        <div class="rank-main">${fmt(p.rank1)}</div>
        <div class="rank-sub">ranking 2: ${fmt(p.rank2)}</div>
      </div>
    </div>`).join("");
}

function renderMatches() {
  matchesEl.innerHTML = DATA[currentTeam].matches.map(m => `
    <div class="match">
      <div class="match-top">
        <div>
          <div class="match-time">${m.time}</div>
          <div class="match-opp">${m.homeaway === "Hjemme" ? "Øst" : m.opponent} – ${m.homeaway === "Hjemme" ? m.opponent : "Øst"}</div>
        </div>
        <div><strong>#${m.matchno}</strong></div>
      </div>
      <div class="meta">
        <span>${m.date}</span><span>${m.court}</span><span>${m.place}</span>
      </div>
    </div>`).join("");
}

function renderCombos() {
  let arr = [...DATA[currentTeam].combos];
  if (comboSort === "low") arr.sort((a,b)=>a.total-b.total);
  else arr.sort((a,b)=>(a.p1+a.p2).localeCompare(b.p1+b.p2,"nb"));
  const vals = arr.map(x=>x.total);
  const min = Math.min(...vals), max = Math.max(...vals);
  combosEl.innerHTML = arr.map(c => {
    const t = (c.total-min)/(max-min || 1);
    const cls = t < .34 ? "good" : t < .67 ? "mid" : "high";
    return `<div class="combo ${cls}">
      <div><strong>${c.p1}</strong><br><span class="small">+ ${c.p2}</span></div>
      <div class="combo-score">${fmt(c.total)}</div>
    </div>`;
  }).join("");
}

function renderProgram() {
  let lastDay = "";
  let out = "";
  DATA[currentTeam].program.forEach(r => {
    if (r.day) {
      lastDay = r.day;
      out += `<div class="program-day">${r.day}</div>`;
    }
    out += `<div class="program-row"><div class="program-time">${r.time}</div><div>${r.activity}</div></div>`;
  });
  programEl.innerHTML = out;
}

document.getElementById("sortLow").onclick = () => {
  comboSort="low";
  document.getElementById("sortLow").classList.add("active");
  document.getElementById("sortName").classList.remove("active");
  renderCombos();
};
document.getElementById("sortName").onclick = () => {
  comboSort="name";
  document.getElementById("sortName").classList.add("active");
  document.getElementById("sortLow").classList.remove("active");
  renderCombos();
};

function render() {
  renderTabs(); renderPlayers(); renderMatches(); renderCombos(); renderProgram();
}
render();
</script>
</body>
</html>
